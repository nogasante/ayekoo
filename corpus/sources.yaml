  # ── Derived documents ───────────────────────────────────────────────────────
  # Restructured from a source already in this corpus. No facts added, removed
  # or changed — only re-typed so that PDF table extraction cannot separate a
  # value from the row it belongs to. Every line is checkable against the
  # original PDF.
  #
  # Why this exists: asked when to plant maize in the forest zone, the model
  # answered with a minor-season window and did not say which season it was,
  # omitting the major season entirely. The underlying table extracts as
  # interleaved fragments, so zones, seasons and dates arrive detached from one
  # another. Planting dates are the highest-stakes content in this corpus and
  # the most likely question a farmer asks, so they are stored unambiguously.
  #
  # `derived: true` marks documents that are NOT raw extractions. Anything
  # written here must trace to a specific section of a specific source. General
  # knowledge does not belong in a derived document.

  - id: derived-maize-planting-calendar
    title: Maize Planting Calendar by Agro-Ecological Zone (restructured from MoFA section 5.1)
    publisher: Directorate of Agricultural Extension Services (DAES), Ministry of Food and Agriculture, Ghana
    year: 2020
    url: https://mofa.gov.gh/site/images/pdf/production_guides/GUIDE_TO_MAIZE_PRODUCTION.pdf
    derived: true
    derived_from: mofa-maize-2020
    crops: [maize]
    topics: [planting_calendar, varieties]
    attribution: "MoFA/DAES, Guide to Maize Production (2020), section 5.1"
