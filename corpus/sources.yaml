  # ── Gaps still open (Kobby: these are the weak spots) ───────────────────────
  # plantain — no MoFA guide exists and iita.org is unreachable from this
  #            network. Best Ghana-specific candidate is the scialert paper
  #            below, which is HTML, not PDF; the fetcher needs an HTML path.
  # cassava  — only non-Ghanaian sources so far (IAEA). Need a Ghanaian one.
  # yam      — only an unreviewed preprint. Weakest of the six.

  - id: plantain-practices-ghana
    title: Plantain Production Practices in the Ashanti, Brong-Ahafo and Eastern Regions of Ghana
    publisher: Asian Journal of Agricultural Research
    year: 2007
    url: https://scialert.net/fulltext/?doi=ajar.2007.1.9
    format: html
    crops: [plantain]
    topics: [planting_calendar, pests_diseases]
    attribution: "Plantain Production Practices in the Ashanti, Brong-Ahafo and Eastern Regions of Ghana (2007)"
    ghana_specific: true
    caveat: "Survey of farmer practice, 2007, three regions. Describes what farmers do, which is not always what is recommended. Useful for local pest names and real practice; do not read as official guidance."
    status: candidate

