# Ayekoo corpus — source manifest.
#
# Every document in the corpus traces back to an entry here. `attribution` is
# what gets stamped onto every chunk and shown to the farmer, so it must be
# accurate and specific enough for a judge to check.
#
# status: confirmed | candidate | dead
#   confirmed — fetched and text-extracted successfully
#   candidate — found but not yet verified
#   dead      — URL is gone; kept so we don't re-hunt it

sources:
  - id: mofa-maize-2020
    title: Guide to Maize Production
    publisher: Directorate of Agricultural Extension Services (DAES), Ministry of Food and Agriculture, Ghana
    year: 2020
    url: https://mofa.gov.gh/site/images/pdf/production_guides/GUIDE_TO_MAIZE_PRODUCTION.pdf
    crops: [maize]
    topics: [planting_calendar, pests_diseases, inputs_costs, harvest_storage]
    attribution: "MoFA/DAES, Guide to Maize Production (2020)"
    licence_note: "Short extracts reproducible in non-advertising, non-profit context provided the source is acknowledged (stated in the document)."
    status: confirmed

  - id: mofa-tomato
    title: Tomato Production Guide
    publisher: Ministry of Food and Agriculture, Ghana
    year: null
    url: https://mofa.gov.gh/site/images/pdf/production_guides/TOMATO_Production_Guide.pdf
    crops: [tomato]
    topics: [planting_calendar, pests_diseases, inputs_costs, harvest_storage]
    attribution: "MoFA, Tomato Production Guide"
    status: confirmed

  - id: mofa-rice
    title: Rice Production Guide
    publisher: Ministry of Food and Agriculture, Ghana
    year: null
    url: https://mofa.gov.gh/site/images/pdf/production_guides/RICE_Production_Guide.pdf
    crops: [rice]
    topics: [planting_calendar, pests_diseases, inputs_costs, harvest_storage]
    attribution: "MoFA, Rice Production Guide"
    # Rice is not one of the six target crops, but it is a Ghanaian staple and
    # a plausible hidden-prompt subject. Cheap to include.
    status: confirmed

  - id: mofa-feed-ghana
    title: Feed Ghana Programme — A Four-Year Agricultural Transformation
    publisher: Ministry of Food and Agriculture, Ghana
    year: 2025
    url: https://mofa.gov.gh/site/images/pdf/Feed_Ghana_Programme.pdf
    crops: []
    topics: [policy, production_targets]
    attribution: "MoFA, Feed Ghana Programme"
    # Policy document. Useful for current-programme context, not agronomy.
    status: confirmed

  - id: srid-facts-figures-2024
    title: Agriculture in Ghana — Facts & Figures 2024
    publisher: Statistics, Research and Information Directorate (SRID), MoFA, Ghana
    year: 2024
    url: "https://srid.mofa.gov.gh/sites/default/files/2025-12/AGRICULTURE IN GHANA (Facts & Figures) 2024.pdf"
    crops: [maize, cassava, yam, cocoa, tomato, plantain, rice]
    topics: [inputs_costs, production_statistics, prices_ghs]
    attribution: "MoFA/SRID, Agriculture in Ghana: Facts & Figures (2024)"
    # The primary source for GHS prices and production figures.
    status: candidate

  # ── Regional (West Africa) sources ──────────────────────────────────────────
  # These are NOT Ghana-specific. They carry solid agronomy for crops MoFA has
  # no published guide for, but they are Nigeria-centred (IITA's stations) or
  # continental. Rule: where a regional source conflicts with a Ghanaian one,
  # the Ghanaian source wins. Chunks from these must not be presented as
  # Ghanaian extension guidance.

  - id: iita-cassava-reference-manual
    title: "Cassava in Tropical Africa: A Reference Manual"
    publisher: International Institute of Tropical Agriculture (IITA)
    year: 1990
    url: https://www.iita.org/wp-content/uploads/2016/06/Cassava_in_tropical_Africa_a_reference_manual_1990.pdf
    note_dead: "iita.org unreachable from Ghana (connection failure, not 404) as of 2026-08-11; retry or find a mirror"
    crops: [cassava]
    topics: [planting_calendar, pests_diseases, harvest_storage]
    attribution: "IITA, Cassava in Tropical Africa: A Reference Manual (1990)"
    ghana_specific: false
    caveat: "Continental scope, 1990. Agronomy is durable; variety names and prices are not. Do not cite for varieties or costs."
    status: candidate

  - id: iita-cassava-training
    title: A Comprehensive Training Module on Competitive Cassava Production
    publisher: International Institute of Tropical Agriculture (IITA)
    year: null
    url: https://www.iita.org/wp-content/uploads/2016/06/A_comprehensive_training_module_on_competitive_cassava_production.pdf
    crops: [cassava]
    topics: [planting_calendar, inputs_costs, pests_diseases]
    attribution: "IITA, Training Module on Competitive Cassava Production"
    ghana_specific: false
    status: candidate

  - id: iita-plantain-west-africa
    title: "Plantain Cultivation Under West African Conditions: A Reference Manual"
    publisher: International Institute of Tropical Agriculture (IITA)
    year: null
    url: https://www.iita.org/wp-content/uploads/2016/05/Plantain-cultivation-under-West-African-conditions-a-reference-manual.pdf
    crops: [plantain]
    topics: [planting_calendar, pests_diseases, harvest_storage]
    attribution: "IITA, Plantain Cultivation Under West African Conditions"
    ghana_specific: false
    caveat: "West African scope. Closest available authority for plantain; MoFA has no plantain guide."
    status: candidate

  - id: iaea-cassava-guidelines
    title: Cassava Production Guidelines for Food Security and Adaptation to Climate Change
    publisher: International Atomic Energy Agency (IAEA)
    year: null
    url: https://www-pub.iaea.org/MTCD/Publications/PDF/TE1840_web.pdf
    crops: [cassava]
    topics: [planting_calendar, inputs_costs]
    attribution: "IAEA, Cassava Production Guidelines"
    ghana_specific: false
    status: candidate

  - id: yam-transition-zone-ghana
    title: Sustaining yam yields amidst climate threat in the forest–savannah transition zone of Ghana
    publisher: bioRxiv preprint
    year: null
    url: https://www.biorxiv.org/content/10.1101/474247.full.pdf
    crops: [yam]
    topics: [planting_calendar, inputs_costs]
    attribution: "Sustaining yam yields in the forest–savannah transition zone of Ghana (preprint)"
    ghana_specific: true
    caveat: "PREPRINT — not peer reviewed. Ghana-specific and zone-specific, which is valuable, but flag any figure taken from it for Kobby's audit."
    status: candidate

  # ── Gaps still open (Kobby: these are the weak spots) ───────────────────────
  # plantain — no MoFA guide exists and iita.org is unreachable from this
  #            network. Best Ghana-specific candidate is the scialert paper
  #            below, which is HTML, not PDF; the fetcher needs an HTML path.
  # cassava  — only non-Ghanaian sources so far (IAEA). Need a Ghanaian one.
  # yam      — only an unreviewed preprint. Weakest of the six.

  - id: plantain-practices-ghana
    title: Plantain Production Practices in the Ashanti, Brong-Ahafo and Eastern Regions of Ghana
    publisher: Asian Journal of Agricultural Research
    year: 2007
    url: https://scialert.net/fulltext/?doi=ajar.2007.1.9
    format: html
    crops: [plantain]
    topics: [planting_calendar, pests_diseases]
    attribution: "Plantain Production Practices in the Ashanti, Brong-Ahafo and Eastern Regions of Ghana (2007)"
    ghana_specific: true
    caveat: "Survey of farmer practice, 2007, three regions. Describes what farmers do, which is not always what is recommended. Useful for local pest names and real practice; do not read as official guidance."
    status: candidate

