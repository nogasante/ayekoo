  # ── Regional (West Africa) sources ──────────────────────────────────────────
  # These are NOT Ghana-specific. They carry solid agronomy for crops MoFA has
  # no published guide for, but they are Nigeria-centred (IITA's stations) or
  # continental. Rule: where a regional source conflicts with a Ghanaian one,
  # the Ghanaian source wins. Chunks from these must not be presented as
  # Ghanaian extension guidance.

  - id: iita-cassava-reference-manual
    title: "Cassava in Tropical Africa: A Reference Manual"
    publisher: International Institute of Tropical Agriculture (IITA)
    year: 1990
    url: https://www.iita.org/wp-content/uploads/2016/06/Cassava_in_tropical_Africa_a_reference_manual_1990.pdf
    note_dead: "iita.org unreachable from Ghana (connection failure, not 404) as of 2026-08-11; retry or find a mirror"
    crops: [cassava]
    topics: [planting_calendar, pests_diseases, harvest_storage]
    attribution: "IITA, Cassava in Tropical Africa: A Reference Manual (1990)"
    ghana_specific: false
    caveat: "Continental scope, 1990. Agronomy is durable; variety names and prices are not. Do not cite for varieties or costs."
    status: dead  # iita.org unreachable; cassava covered by the CGSpace mirrors below

  - id: iita-cassava-training
    title: A Comprehensive Training Module on Competitive Cassava Production
    publisher: International Institute of Tropical Agriculture (IITA)
