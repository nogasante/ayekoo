    crops: [cassava]
    topics: [planting_calendar, inputs_costs, pests_diseases]
    attribution: "IITA, Training Module on Competitive Cassava Production"
    ghana_specific: false
    status: dead  # iita.org unreachable from this network; superseded by the CGSpace mirror below

