# Ayekoo corpus — source manifest.
#
# Every document in the corpus traces back to an entry here. `attribution` is
# what gets stamped onto every chunk and shown to the farmer, so it must be
# accurate and specific enough for a judge to check.
#
# status: confirmed | candidate | dead
#   confirmed — fetched and text-extracted successfully
#   candidate — found but not yet verified
#   dead      — URL is gone; kept so we don't re-hunt it

sources:
  - id: mofa-maize-2020
    title: Guide to Maize Production
    publisher: Directorate of Agricultural Extension Services (DAES), Ministry of Food and Agriculture, Ghana
    year: 2020
    url: https://mofa.gov.gh/site/images/pdf/production_guides/GUIDE_TO_MAIZE_PRODUCTION.pdf
    crops: [maize]
    topics: [planting_calendar, pests_diseases, inputs_costs, harvest_storage]
    attribution: "MoFA/DAES, Guide to Maize Production (2020)"
    licence_note: "Short extracts reproducible in non-advertising, non-profit context provided the source is acknowledged (stated in the document)."
    status: confirmed

